{% extends 'Admin/homeadmin.html' %}
{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Department</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <div class="container">
    <h2 class="mb-4">Add Department</h2>
    <form method="post" action="/myapp/adddepartment_post/">
        {% csrf_token %}
      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Department Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" name="department" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="dob" class="col-sm-4 ">Department Type</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="depttype" name="type" required>
        </div>
      </div>
        <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Description</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" name="description" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Contact Number</label>
        <div class="col-sm-8">
          <input type="tel" pattern="[0-9]{10}" class="form-control" id="phone" name="number" required>
        </div>
      </div>
      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address</label>
        <div class="col-sm-8">
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
      </div>



      <div class="row mb-3">
        <label for="place" class="col-sm-4 ">Place</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="place" name="place" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="place" class="col-sm-4 ">Post</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="place" name="post" required>
        </div>
      </div>
      <div class="row mb-3">
        <label for="city" class="col-sm-4 ">City</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="city" name="city" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="city" class="col-sm-4 ">District</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="city" name="district" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="state" class="col-sm-4 ">State</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="state" name="state" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="pincode" class="col-sm-4 ">Pincode</label>
        <div class="col-sm-8">
          <input type="text" pattern="[0-9]{6}" class="form-control" id="pincode" name="pincode" required>
        </div>
      </div>

         <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </div>

    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
